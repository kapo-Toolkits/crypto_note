<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="დაშიფრული ტექსტის გაცვლა საერთო PIN-ით — ხელით გადასაწერი Crockford Base32">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#3F51B5">
  <meta name="color-scheme" content="light dark">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="დაშიფრული ჩანაწერი">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Flutter engine აყენებს user-scalable=no; pinch-zoom-ს ვაბრუნებთ წაკითხვადობისთვის -->
  <script>
    (function () {
      var wanted = 'width=device-width, initial-scale=1.0, viewport-fit=cover';
      function allowZoom() {
        var vp = document.querySelector('meta[name="viewport"]');
        if (!vp) {
          vp = document.createElement('meta');
          vp.setAttribute('name', 'viewport');
          document.head.appendChild(vp);
        }
        if (vp.getAttribute('content') !== wanted) {
          vp.setAttribute('content', wanted);
        }
      }
      allowZoom();
      new MutationObserver(allowZoom).observe(
        document.head, { childList: true, subtree: true, attributes: true });
    })();
  </script>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>დაშიფრული ჩანაწერი</title>
  <link rel="manifest" href="manifest.json">

  <!-- In-app browser (Messenger/Instagram/FB) გამოვლენა და "ბრაუზერში გახსნის" ბანერი.
       ამ ჩაშენებულ ბრაუზერებში Flutter web არასწორად მასშტაბდება. -->
  <style>
    #iab-banner {
      position: fixed; top: 0; left: 0; right: 0; z-index: 2147483647;
      background: #3F51B5; color: #fff;
      font-family: system-ui, -apple-system, "Noto Sans Georgian", sans-serif;
      display: flex; flex-direction: column; gap: 10px;
      padding: 10px 12px; box-shadow: 0 2px 8px rgba(0,0,0,.3);
      font-size: 14px; line-height: 1.35;
    }
    #iab-banner .iab-top {
      display: flex; align-items: center; gap: 8px;
    }
    #iab-banner .iab-txt { flex: 1; min-width: 0; }
    #iab-banner .iab-actions { display: flex; gap: 8px; }
    #iab-banner .iab-actions button { flex: 1; }
    #iab-banner button {
      border: 0; border-radius: 8px; padding: 10px 12px;
      font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap;
      font-family: inherit;
    }
    #iab-open { background: #fff; color: #3F51B5; }
    #iab-copy { background: rgba(255,255,255,.18); color: #fff; }
    #iab-close {
      flex: none; background: rgba(255,255,255,.15); color: #fff;
      font-size: 16px; padding: 4px 10px; border-radius: 8px;
    }
  </style>
  <script>
    (function () {
      var ua = navigator.userAgent || '';
      var inApp = /FBAN|FBAV|FB_IAB|FB4A|Messenger|Instagram|MicroMessenger|Line\/|Twitter|WhatsApp|Snapchat|TikTok|Viber/i.test(ua);
      if (!inApp) return;
      var LINK = 'https://text.qgis.ge/';
      function build() {
        if (document.getElementById('iab-banner')) return;
        var b = document.createElement('div');
        b.id = 'iab-banner';
        b.innerHTML =
          '<div class="iab-top">' +
            '<span class="iab-txt">უკეთესი ხედისთვის გახსენით ბრაუზერში</span>' +
            '<button id="iab-close" aria-label="დახურვა">✕</button>' +
          '</div>' +
          '<div class="iab-actions">' +
            '<button id="iab-open">Chrome-ში</button>' +
            '<button id="iab-copy">ლინკის კოპირება</button>' +
          '</div>';
        document.body.appendChild(b);
        document.getElementById('iab-open').onclick = function () {
          // Android: Chrome-ის intent; iOS-ზე უბრალოდ ხელახლა გახსნა
          if (/Android/i.test(ua)) {
            window.location.href =
              'intent://text.qgis.ge/#Intent;scheme=https;package=com.android.chrome;end';
          } else {
            window.open(LINK, '_blank');
          }
        };
        document.getElementById('iab-copy').onclick = function () {
          var btn = this;
          function ok() { btn.textContent = 'დაკოპირდა ✓'; }
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(LINK).then(ok, function () {});
          } else {
            var t = document.createElement('textarea');
            t.value = LINK; document.body.appendChild(t); t.select();
            try { document.execCommand('copy'); ok(); } catch (e) {}
            document.body.removeChild(t);
          }
        };
        document.getElementById('iab-close').onclick = function () {
          var el = document.getElementById('iab-banner');
          if (el) el.remove();
        };
      }
      if (document.body) build();
      else document.addEventListener('DOMContentLoaded', build);
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
